# Install as <config_dir>/config.toml; `stock-tui --print-config` shows the path.
# A working-directory config.toml is not loaded automatically.
# Alpaca onboarding stores keys separately in <config_dir>/credentials.env.
# That file never selects Alpaca or overrides the provider chosen below.
provider = "alpaca"
refresh_seconds = 300
catalog_url = "https://stock.chatcode.dev/catalog/sec-catalog.json"
catalog_refresh_hours = 12

[providers.alpaca]
feed = "iex"
request_limit_per_minute = 180
snapshot_batch_size = 100
history_batch_size = 50

# Advanced provider endpoints:
# data_url = "https://data.alpaca.markets"
# trading_url = "https://paper-api.alpaca.markets"

# Normalized HTTP adapter. Select with provider = "stock-api".
# The private project endpoint is not a licensed public market-data service.
[providers.stock_api]
base_url = "https://stock.chatcode.dev/api"
news = true
# Optional bearer token for a trusted compatible service. Keep this file private.
# token = "replace-with-an-out-of-band-token"

# Local Cloudflare Worker development:
# base_url = "http://127.0.0.1:8787"
