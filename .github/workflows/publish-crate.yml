name: Publish crate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated GitHub release tag, for example v0.3.1
        required: true
        type: string
      operation:
        description: Verify the package, authenticate with OIDC, or publish it
        required: true
        default: verify
        type: choice
        options:
          - verify
          - verify-trusted
          - publish-initial
          - publish-trusted

permissions:
  actions: read
  contents: read

concurrency:
  group: crates-io-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE_NAME: stock-tui
  MAX_CRATE_SIZE_BYTES: "10485760"

jobs:
  package:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
      - name: Verify release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$OPERATION" != "verify" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Publishing must be dispatched from the reviewed main branch.\n' >&2
            exit 1
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          package_version="$(
            cargo metadata --locked --no-deps --format-version=1 \
              | jq -r --arg crate "$CRATE_NAME" \
                  '.packages[] | select(.name == $crate) | .version'
          )"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            printf 'Release tag %s does not match package version %s.\n' \
              "$RELEASE_TAG" "$package_version" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
            printf '%s must be an annotated tag.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$release_commit" != "$(git rev-parse HEAD)" ]]; then
            printf 'Checked-out commit does not match %s.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            printf '%s at %s is not on the reviewed main branch.\n' \
              "$RELEASE_TAG" "$release_commit" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -Fx -- "$RELEASE_TAG" >/dev/null

          release_runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch "$RELEASE_TAG" \
              --event push \
              --status success \
              --limit 20 \
              --json headSha,url
          )"
          if ! jq -e --arg commit "$release_commit" \
              'any(.[]; .headSha == $commit)' <<< "$release_runs" >/dev/null; then
            printf 'No successful Release workflow run matches %s at %s.\n' \
              "$RELEASE_TAG" "$release_commit" >&2
            exit 1
          fi

          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail

          package_file_list="$RUNNER_TEMP/package-files.txt"
          cargo package --locked --list > "$package_file_list"
          tools/release/verify-crate-contents.sh "$package_file_list"
      - name: Build package and enforce package size
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          package_file_list="$RUNNER_TEMP/package-files.txt"
          cargo package --locked
          crate_file="target/package/${CRATE_NAME}-${PACKAGE_VERSION}.crate"
          if [[ ! -f "$crate_file" ]]; then
            printf 'Expected package was not created: %s\n' "$crate_file" >&2
            exit 1
          fi

          crate_size="$(wc -c < "$crate_file" | tr -d '[:space:]')"
          if (( crate_size > MAX_CRATE_SIZE_BYTES )); then
            printf 'Package is %s bytes; crates.io permits at most %s bytes.\n' \
              "$crate_size" "$MAX_CRATE_SIZE_BYTES" >&2
            exit 1
          fi

          {
            printf '### crates.io package\n\n'
            printf -- '- Release: `%s`\n' "$RELEASE_TAG"
            printf -- '- Version: `%s`\n' "$PACKAGE_VERSION"
            printf -- '- Compressed size: `%s` bytes (limit: `%s`)\n' \
              "$crate_size" "$MAX_CRATE_SIZE_BYTES"
            printf -- '- Files: `%s`\n' \
              "$(wc -l < "$package_file_list" | tr -d '[:space:]')"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-initial:
    name: Publish initial crate with token
    if: inputs.operation == 'publish-initial'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.package.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          EXPECTED_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            printf 'CRATES_TOKEN is not configured in the crates-io environment.\n' >&2
            exit 1
          fi
          package_version="$(
            cargo metadata --locked --no-deps --format-version=1 \
              | jq -r --arg crate "$CRATE_NAME" \
                  '.packages[] | select(.name == $crate) | .version'
          )"
          test "$package_version" = "$EXPECTED_VERSION"
          cargo publish --locked --registry crates-io

  publish-trusted:
    name: Verify or publish with trusted publishing
    if: inputs.operation == 'verify-trusted' || inputs.operation == 'publish-trusted'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.package.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify trusted publisher authentication
        if: inputs.operation == 'verify-trusted'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          printf 'Trusted publisher authentication succeeded.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to crates.io
        if: inputs.operation == 'publish-trusted'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          EXPECTED_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          package_version="$(
            cargo metadata --locked --no-deps --format-version=1 \
              | jq -r --arg crate "$CRATE_NAME" \
                  '.packages[] | select(.name == $crate) | .version'
          )"
          test "$package_version" = "$EXPECTED_VERSION"
          cargo publish --locked --registry crates-io
