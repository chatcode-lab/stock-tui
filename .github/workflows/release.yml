name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "stock-tui") | .version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: cargo test --locked --all-targets
      - name: Validate release scripts
        run: bash -n tools/release/sign-notarize-macos.sh

  catalog:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CATALOG_URL: https://stock.chatcode.dev/catalog/sec-catalog.json
      CATALOG_MANIFEST_URL: https://stock.chatcode.dev/catalog/sec-catalog.manifest.json
    steps:
      - name: Download current compact SEC catalog
        shell: bash
        run: |
          mkdir -p data
          curl --compressed --fail --location --retry 3 \
            "$CATALOG_URL" \
            --output data/sec_universe.json
          curl --fail --location --retry 3 \
            "$CATALOG_MANIFEST_URL" \
            --output data/sec_universe.manifest.json
      - name: Validate catalog envelope
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = Path("data/sec_universe.json").read_bytes()
          catalog = json.loads(payload)
          manifest = json.loads(Path("data/sec_universe.manifest.json").read_text())
          assert catalog["schema_version"] == 2
          assert isinstance(catalog["catalog_version"], str)
          assert len(catalog["companies"]) >= 900
          assert len({row["cik"] for row in catalog["companies"]}) == len(catalog["companies"])
          assert len({row["sector"] for row in catalog["companies"]}) == 9
          assert manifest["catalog"]["catalog_version"] == catalog["catalog_version"]
          assert manifest["artifact"]["payload_size_bytes"] == len(payload)
          assert manifest["artifact"]["payload_sha256"] == hashlib.sha256(payload).hexdigest()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sec-catalog
          path: data/sec_universe.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [verify, catalog]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stock-tui-x86_64-unknown-linux-musl
            binary: stock-tui
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            artifact: stock-tui-aarch64-unknown-linux-musl
            binary: stock-tui
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            artifact: stock-tui-x86_64-pc-windows-msvc
            binary: stock-tui.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sec-catalog
          path: data
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Configure musl compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target_key="${{ matrix.target }}"
          target_key="${target_key//-/_}"
          target_upper="${target_key^^}"
          echo "CC_${target_key}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Stage Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "stock-tui") | .version')"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          cp README.md LICENSE CHANGELOG.md config.example.toml .env.example dist/
          "./dist/${{ matrix.binary }}" --version
          tar -C dist -czf "stock-tui-v${package_version}-${{ matrix.target }}.tar.gz" .
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version=1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq "stock-tui" | Select-Object -First 1).version
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item README.md,LICENSE,CHANGELOG.md,config.example.toml,.env.example dist/
          & "./dist/${{ matrix.binary }}" --version
          Compress-Archive -Path dist/* -DestinationPath "stock-tui-v${packageVersion}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            stock-tui-v*-${{ matrix.target }}.tar.gz
            stock-tui-v*-${{ matrix.target }}.zip
          if-no-files-found: error

  build-macos:
    needs: [verify, catalog]
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: stock-tui-aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact: stock-tui-x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sec-catalog
          path: data
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Stage macOS payload
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/stock-tui" dist/
          cp README.md LICENSE CHANGELOG.md config.example.toml .env.example dist/
          ./dist/stock-tui --version
      - name: Sign and notarize macOS release
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          tools/release/sign-notarize-macos.sh dist/stock-tui
      - name: Archive signed macOS executable
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "stock-tui") | .version')"
          archive="stock-tui-v${package_version}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$archive" .

          verification_directory="$(mktemp -d "${RUNNER_TEMP%/}/stock-tui-archive.XXXXXX")"
          trap 'rm -rf "$verification_directory"' EXIT
          tar -C "$verification_directory" -xzf "$archive"
          cmp -s dist/stock-tui "$verification_directory/stock-tui"
          codesign --verify --strict --verbose=2 "$verification_directory/stock-tui"

          if ! gatekeeper_output="$(
            spctl --assess --type execute --verbose=2 \
              "$verification_directory/stock-tui" 2>&1
          )"; then
            printf '%s\n' "$gatekeeper_output" \
              | sed -n -e '/: rejected$/p' -e '/^source=/p' >&2
            exit 1
          fi
          if ! grep -Fxq 'source=Notarized Developer ID' \
            <<<"$gatekeeper_output"; then
            printf '%s\n' "$gatekeeper_output" \
              | sed -n -e '/: accepted$/p' -e '/^source=/p' >&2
            exit 1
          fi
          printf 'Archived executable assessment: source=Notarized Developer ID.\n'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: stock-tui-v*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: artifacts/*
