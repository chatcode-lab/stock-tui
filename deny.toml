[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "Informational maintenance notice. Chrono remains part of the stored timestamp and SQLite interfaces pending migration." },
  { id = "RUSTSEC-2026-0555", reason = "Informational maintenance notice. Chrono-TZ remains in use for exchange session calculations pending migration." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"

